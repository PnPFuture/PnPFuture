<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <title>Welcome to P&amp;P Future</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #efe9fb url('background.jpg') center / cover no-repeat;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: transparent;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
    }

    h1 {
      margin-bottom: 0;
      line-height: 1.1;
    }

    h1 .welcome {
      display: block;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #5b21b6;
      margin-bottom: 6px;
    }

    h1 .brand {
      display: block;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: 46px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.5px;
      color: #5b21b6;
      background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 55%, #2e1065 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.9));
    }

    .divider {
      width: 70px;
      height: 3px;
      margin: 14px auto 14px;
      border-radius: 3px;
      background: linear-gradient(90deg, #a78bfa, #3b82f6);
    }


    .tagline {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #4c1d95;
      margin-bottom: 28px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 18px 12px 12px;
      border-radius: 22px;
      text-decoration: none;
      text-align: left;
      color: #3b1a7a;
      background: rgba(255, 255, 255, 0.30);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn .icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(76, 29, 149, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn .icon svg {
      width: 24px;
      height: 24px;
    }

    .btn .text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .btn .text strong {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #3b1a7a;
    }

    .btn .text small {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      color: #6d5a99;
    }

    .btn::after {
      content: "\203A";
      font-size: 30px;
      line-height: 1;
      color: #7c3aed;
      transition: transform 0.18s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 14px 30px rgba(76, 29, 149, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .btn:hover::after,
    .btn:focus-visible::after {
      transform: translateX(4px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-profile .icon  { background: linear-gradient(135deg, #8b5cf6, #5b21b6); }
    .btn-map .icon      { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .btn-whatsapp .icon { background: linear-gradient(135deg, #25d366, #128c7e); }

    /* Phones and small screens use the mobile background */
    @media (max-width: 768px) {
      body {
        background: #efe9fb url('background-mobile.jpg') center / cover no-repeat;
      }
    }
  </style>
</head>
<body>

    <div class="divider"></div>
    <p class="tagline">Your Trusted Plumbing &amp; Bathroom Fitting Service</p>

    </div>
  </main>
</body>
</html>
